name: Scan
description: >-
  Push-time secret and workflow scan, run as the last step of a caller's
  existing verify job. On push it scans the pushed range; on
  workflow_dispatch it scans full history; every other event passes through.
  Gitleaks runs on private repositories. Actionlint and Zizmor run when the
  range changes .github/, action metadata, or their configuration.
inputs:
  gitleaks:
    description: auto scans private repositories only; true or false forces it.
    required: false
    default: auto
  token:
    description: >-
      Token that deepens the caller's credential-less checkout and serves
      Zizmor's online audits.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Select scan range
      id: plan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PRIVATE: ${{ github.event.repository.private }}
        GITLEAKS: ${{ inputs.gitleaks }}
        TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/plan.sh"'
    - name: Scan secrets with Gitleaks
      if: ${{ steps.plan.outputs.gitleaks == 'true' }}
      shell: bash
      env:
        LOG_OPTS: ${{ steps.plan.outputs.log-opts }}
      run: |
        log="$RUNNER_TEMP/gitleaks.log"
        status=0
        docker run --rm --network none -v "$PWD:/repo:ro" \
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          git /repo --log-opts="$LOG_OPTS" --redact --verbose --no-banner --no-color 2>&1 |
          tee "$log" || status=$?
        if grep -q ' ERR ' "$log"; then
          echo "::error::Gitleaks could not read $LOG_OPTS"
          exit 1
        fi
        exit "$status"
    - name: Lint workflows with Actionlint
      if: ${{ !cancelled() && steps.plan.outputs.workflows == 'true' }}
      shell: bash
      run: |
        docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
          -color
    - name: Audit workflows with Zizmor
      if: ${{ !cancelled() && steps.plan.outputs.workflows == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" \
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
          /repo
