[tools]
actionlint = "1.7.12"
node = "24.21.0"
pnpm = "12.4.2"
zizmor = "1.30.1"

[tasks.validate]
description = "Validate the shared preset and this repository's Renovate config"
run = "pnpm exec renovate-config-validator --strict --no-global renovate-config.json renovate.json"

[tasks.actions]
description = "Validate and audit GitHub Actions"
shell = "bash -c"
run = '''
set -euo pipefail
actionlint
zizmor .github/workflows .github/actions
'''

[tasks.verify]
description = "Install locked dependencies, validate Renovate config, and audit workflows"
run = [
  "pnpm install --frozen-lockfile",
  "mise run validate",
  "mise run actions"
]
